<script>
(()=>{
'use strict';
if(!window.Matter){document.getElementById('err').style.display='flex';return;}
const {Engine,Bodies,Body,Composite,Constraint,Events,Query}=Matter;

/* =====================================================================
   SECTION 1 - CONFIGURATION
   ===================================================================== */
const W=720,H=960,BR=22,STEP=1000/120,TAU=Math.PI*2;
const CAT={world:1,ball:2,stroke:4,rope:8};
const FONT="'Trebuchet MS','Arial Rounded MT Bold','Segoe UI',system-ui,sans-serif";
const WORLDS=[
 {name:'Happy Land',col:'#5ccf6a',dk:'#2f9e44',sky:['#cfeeff','#f6fcff'],icon:'sun'},
 {name:'Bouncy Forest',col:'#2fb98a',dk:'#1b7f5c',sky:['#d3f5df','#f4fff8'],icon:'tree'},
 {name:'Candy World',col:'#ff7eb6',dk:'#d6407f',sky:['#ffdff0','#fff8fc'],icon:'candy'},
 {name:'Crazy Factory',col:'#ffa24a',dk:'#c9651a',sky:['#dfe6ef','#f7f9fc'],icon:'gear'},
 {name:'Magic World',col:'#9b6bff',dk:'#6a3fd1',sky:['#e0d5ff','#f8f4ff'],icon:'wand'}];
const MAT={
 wood:{fr:.5,fs:.6,re:.3,de:.002,col:'#e2ad6e',dk:'#a5672f'},
 stone:{fr:.6,fs:.7,re:.2,de:.004,col:'#bfc4d2',dk:'#868ca4'},
 rubber:{fr:.6,fs:.6,re:.95,de:.0015,col:'#ff7aa8',dk:'#d63f7a'},
 ice:{fr:.01,fs:.01,re:.1,de:.002,col:'#c4f0ff',dk:'#74c6e6'},
 metal:{fr:.3,fs:.4,re:.05,de:.009,col:'#a9b8cc',dk:'#62758f'},
 glass:{fr:.4,fs:.5,re:.15,de:.0025,col:'#d9f4ff',dk:'#8fd0ee'}};
const PEN={
 rigid:{name:'Rigid Pen',mult:1,col:'#3b82f6',hi:'#9cc9ff',tip:'Solid line. It falls with gravity.'},
 fixed:{name:'Anchor Pen',mult:1.4,col:'#8b5cf6',hi:'#cbb6ff',tip:'Supported platform. Stays in the air.'},
 hang:{name:'Hanging Pen',mult:1.3,col:'#f59e0b',hi:'#ffd98f',tip:'Platform hung from two ropes.'},
 rope:{name:'Rope Pen',mult:1,col:'#a16207',hi:'#e8bd73',tip:'Flexible rope, pinned to nearby objects.'},
 spring:{name:'Spring Pen',mult:1.5,col:'#ec4899',hi:'#ffb8da',tip:'Bouncy spring platform.'}};
const THICK=[{n:'Thin',v:8,m:.85},{n:'Medium',v:8,m:1},{n:'Thick',v:18,m:1.3}];

/* =====================================================================
   SECTION 2 - UTILITIES
   ===================================================================== */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const backOut=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
function rr(c,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function T(c,s,x,y,size,col,al,stroke,wt){c.font=(wt||'800')+' '+size+'px '+FONT;c.textAlign=al||'center';c.textBaseline='middle';
  if(stroke){c.lineJoin='round';c.lineWidth=stroke[1];c.strokeStyle=stroke[0];c.strokeText(s,x,y);}c.fillStyle=col||'#2b3a67';c.fillText(s,x,y);}
function starPath(c,x,y,R,r,rot){const p=[];for(let i=0;i<10;i++){const a=rot-Math.PI/2+i*Math.PI/5,rad=i%2?r*1.05:R*1.12;p.push([x+Math.cos(a)*rad,y+Math.sin(a)*rad]);}
  const mid=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];c.beginPath();const m0=mid(p[9],p[0]);c.moveTo(m0[0],m0[1]);for(let i=0;i<10;i++){const q=p[i],m=mid(q,p[(i+1)%10]);c.quadraticCurveTo(q[0],q[1],m[0],m[1]);}c.closePath();}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.5,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.4);c.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.5,y-s*.1,x,y+s*.9);c.closePath();}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function polyLen(p){let l=0;for(let i=1;i<p.length;i++)l+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return l;}
function simplify(pts,eps){ // Ramer-Douglas-Peucker
  if(pts.length<3)return pts.slice();
  const keep=new Uint8Array(pts.length);keep[0]=keep[pts.length-1]=1;const st=[[0,pts.length-1]];
  while(st.length){const [a,b]=st.pop();let md=0,mi=-1;const A=pts[a],B=pts[b],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1e-6;
    for(let i=a+1;i<b;i++){const d=Math.abs((pts[i][0]-A[0])*dy-(pts[i][1]-A[1])*dx)/L;if(d>md){md=d;mi=i;}}
    if(md>eps&&mi>0){keep[mi]=1;st.push([a,mi],[mi,b]);}}
  return pts.filter((p,i)=>keep[i]);
}
function resample(pts,step){ // even spacing along a polyline
  const out=[pts[0].slice()];let acc=0;
  for(let i=1;i<pts.length;i++){let ax=pts[i-1][0],ay=pts[i-1][1];const bx=pts[i][0],by=pts[i][1];let seg=Math.hypot(bx-ax,by-ay);
    while(acc+seg>=step){const t=(step-acc)/seg;ax+=(bx-ax)*t;ay+=(by-ay)*t;out.push([ax,ay]);seg=Math.hypot(bx-ax,by-ay);acc=0;}
    acc+=seg;}
  const last=pts[pts.length-1];const lo=out[out.length-1];if(Math.hypot(last[0]-lo[0],last[1]-lo[1])>step*.4)out.push(last.slice());
  return out;
}

/* =====================================================================
   SECTION 3 - SAVE SYSTEM (LocalStorage, corruption safe)
   ===================================================================== */
const SAVE_KEY='emojidrop.save.v1';
const defSave=()=>({v:1,unlocked:1,lv:{},coins:0,chars:['happy'],sel:'happy',ach:{},wr:{},
  st:{wins:0,drops:0,fails:0,bounces:0,minInk:1,hints:0,dailyDone:0},daily:{date:'',done:false},
  set:{music:true,sfx:true,mv:.5,sv:.8,vib:true,gfx:'high'}});
function loadSave(){
  try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return defSave();const o=JSON.parse(raw);if(!o||typeof o!=='object')return defSave();
    const d=defSave(),s=Object.assign(d,o);
    s.set=Object.assign(defSave().set,(o.set&&typeof o.set==='object')?o.set:{});
    s.st=Object.assign(defSave().st,(o.st&&typeof o.st==='object')?o.st:{});
    s.daily=Object.assign(defSave().daily,(o.daily&&typeof o.daily==='object')?o.daily:{});
    ['lv','ach','wr'].forEach(k=>{if(!s[k]||typeof s[k]!=='object'||Array.isArray(s[k]))s[k]={};});
    s.unlocked=clamp(Math.floor(+s.unlocked||1),1,50);s.coins=Math.max(0,Math.floor(+s.coins||0));
    if(!Array.isArray(s.chars)||!s.chars.includes('happy'))s.chars=['happy'];
    s.chars=s.chars.filter(x=>typeof x==='string');
    if(!s.chars.includes(s.sel))s.sel='happy';
    s.set.mv=clamp(+s.set.mv||0,0,1);s.set.sv=clamp(+s.set.sv||0,0,1);
    for(const k in s.lv){const e=s.lv[k];if(!e||typeof e!=='object'){delete s.lv[k];continue;}e.stars=clamp(Math.floor(+e.stars||0),0,3);}
    return s;}catch(e){return defSave();}
}
let SAVE=loadSave();
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE));}catch(e){}}
const totalStars=()=>Object.values(SAVE.lv).reduce((a,e)=>a+(e.stars||0),0);
const doneCount=()=>Object.values(SAVE.lv).filter(e=>e.stars>0).length;
const levelStars=i=>(SAVE.lv[i]&&SAVE.lv[i].stars)||0;
const worldDone=w=>{for(let i=w*10+1;i<=w*10+10;i++)if(!levelStars(i))return false;return true;};

/* =====================================================================
   SECTION 4 - AUDIO SYSTEM (Web Audio, fully procedural)
   ===================================================================== */
const AU={ctx:null,lastDraw:0,
  init(){
    if(this.ctx)return;
    try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const a=this.ctx=new AC();
      this.sfxG=a.createGain();this.sfxG.connect(a.destination);this.musicG=a.createGain();this.musicG.connect(a.destination);
      const len=a.sampleRate,buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=buf;
      const src=a.createBufferSource();src.buffer=buf;src.loop=true;this.rollF=a.createBiquadFilter();this.rollF.type='lowpass';this.rollF.frequency.value=300;
      this.rollG=a.createGain();this.rollG.gain.value=0;src.connect(this.rollF);this.rollF.connect(this.rollG);this.rollG.connect(this.sfxG);src.start();
      this.applyVol();this.startMusic();}catch(e){this.ctx=null;}
  },
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
  applyVol(){if(!this.ctx)return;this.sfxG.gain.value=SAVE.set.sfx?SAVE.set.sv:0;this.musicG.gain.value=SAVE.set.music?SAVE.set.mv*.3:0;if(!SAVE.set.sfx)this.setRoll(0);},
  tone(f,d,type,v,to,delay,mus){
    const a=this.ctx;if(!a||(mus?!SAVE.set.music:!SAVE.set.sfx))return;d=d||.15;
    const t0=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);
    if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(Math.max(.0002,v||.25),t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(mus?this.musicG:this.sfxG);o.start(t0);o.stop(t0+d+.05);
  },
  noise(d,v,fq,delay){
    const a=this.ctx;if(!a||!SAVE.set.sfx)return;const t0=a.currentTime+(delay||0),s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=this.nb;f.type='bandpass';f.frequency.value=fq||1000;g.gain.setValueAtTime(v||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    s.connect(f);f.connect(g);g.connect(this.sfxG);s.start(t0,Math.random());s.stop(t0+d+.05);
  },
  setRoll(v){if(!this.ctx)return;const t=this.ctx.currentTime;this.rollG.gain.setTargetAtTime(SAVE.set.sfx?v*.22:0,t,.05);this.rollF.frequency.setTargetAtTime(160+v*700,t,.05);},
  click(){this.tone(620,.09,'triangle',.25,880);},
  draw(){const n=performance.now();if(n-this.lastDraw<55)return;this.lastDraw=n;this.tone(380+rnd(0,120),.06,'sine',.07);},
  bounce(i){this.tone(240+i*260,.2,'sine',.15+.3*i,90);},
  boing(i){this.tone(180,.4,'sine',.18+.2*i,760);},
  hit(i){this.noise(.09,.08+.25*i,700);this.tone(130,.1,'triangle',.08+.2*i);},
  plop(){this.tone(380,.16,'sine',.3,900);this.tone(760,.12,'sine',.12,1400,.05);},
  drop(){this.tone(720,.28,'sine',.22,180);},
  pop(){this.tone(520,.1,'sine',.22,1100);},
  coin(){this.tone(988,.08,'square',.09);this.tone(1319,.2,'square',.09,0,.07);},
  win(){[523,659,784,1047].forEach((f,i)=>this.tone(f,.34,'triangle',.26,0,i*.11));},
  star(i){this.tone(660+i*220,.4,'sine',.28);this.tone(1320+i*440,.22,'triangle',.12);},
  unlock(){[523,659,784,988,1319].forEach((f,i)=>this.tone(f,.25,'triangle',.22,0,i*.08));},
  fail(){this.tone(420,.55,'sawtooth',.14,110);this.tone(300,.5,'triangle',.12,80,.1);},
  startMusic(){
    const sc=[261.63,293.66,329.63,392,440,523.25,587.33,659.25],mel=[0,2,4,2,5,4,2,1,0,2,4,7,6,4,2,4,3,4,5,4,2,1,0,1,2,4,5,4,2,0,1,-1];let step=0;
    setInterval(()=>{if(!this.ctx||!SAVE.set.music||document.hidden)return;const n=mel[step%mel.length];
      if(n>=0)this.tone(sc[n],.5,'triangle',.5,0,0,true);
      if(step%4===0)this.tone(sc[[0,3,4,2][(step>>2)%4]]/2,.9,'sine',.5,0,0,true);step++;},300);
  }};
const vib=ms=>{if(SAVE.set.vib&&navigator.vibrate)try{navigator.vibrate(ms);}catch(e){}};

/* =====================================================================
   SECTION 5 - PARTICLES (pooled, no per-frame allocation)
   ===================================================================== */
const PN=420,PARTS=Array.from({length:PN},()=>({on:false,x:0,y:0,vx:0,vy:0,life:0,max:1,size:3,col:'#fff',kind:0,g:0,rot:0,vr:0}));let pIdx=0;
function spawnP(x,y,vx,vy,life,size,col,kind,g){
  const p=PARTS[pIdx=(pIdx+1)%PN];p.on=true;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.life=p.max=life;p.size=size;p.col=col;p.kind=kind||0;p.g=g===undefined?500:g;p.rot=rnd(0,TAU);p.vr=rnd(-8,8);
}
const gfxK=()=>SAVE.set.gfx==='low'?.45:1;
function burst(x,y,n,col,spd,kind,life,size,g){n=Math.ceil(n*gfxK());for(let i=0;i<n;i++){const a=rnd(0,TAU),s=rnd(.3,1)*spd;spawnP(x,y,Math.cos(a)*s,Math.sin(a)*s,rnd(.5,1)*(life||.7),(size||4)*rnd(.7,1.2),Array.isArray(col)?col[i%col.length]:col,kind,g);}}
function updateP(dt){for(const p of PARTS){if(!p.on)continue;p.life-=dt;if(p.life<=0){p.on=false;continue;}p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;if(p.kind===4){p.vx*=.96;p.vy*=.96;}}}
function drawP(c){
  for(const p of PARTS){if(!p.on)continue;const k=p.life/p.max;c.globalAlpha=clamp(k*1.6,0,1);c.fillStyle=p.col;
    switch(p.kind){
      case 0:c.beginPath();c.arc(p.x,p.y,p.size*(.4+k*.6),0,TAU);c.fill();break;
      case 1:starPath(c,p.x,p.y,p.size*(.5+k*.8),p.size*.35*(.5+k*.8),p.rot);c.fill();break;
      case 2:c.save();c.translate(p.x,p.y);c.rotate(p.rot);c.fillRect(-p.size,-p.size*.5,p.size*2,p.size);c.restore();break;
      case 3:c.strokeStyle=p.col;c.lineWidth=3*k+1;c.beginPath();c.arc(p.x,p.y,p.size*(2-k)*3,0,TAU);c.stroke();break;
      case 4:c.globalAlpha=k*.55;c.beginPath();c.arc(p.x,p.y,p.size*(1.6-k*.8),0,TAU);c.fill();break;}
  }c.globalAlpha=1;
}

/* =====================================================================
   SECTION 6 - EMOJI CHARACTERS (all drawn with Canvas paths)
   ===================================================================== */
const CHARS=[
 {id:'happy',name:'Happy',c:['#fff07a','#ffb62e'],line:'#d98a12',eyes:'open',mouth:'smile',cheeks:1,cond:{k:'default',v:0,txt:'Unlocked from the start'}},
 {id:'laugh',name:'Laugh',c:['#fff07a','#ffb62e'],line:'#d98a12',eyes:'squint',mouth:'grin',cheeks:1,cond:{k:'wins',v:3,txt:'Complete 3 levels'}},
 {id:'shock',name:'Shock',c:['#fff07a','#ffb62e'],line:'#d98a12',eyes:'wide',mouth:'o',cheeks:0,cond:{k:'stars',v:15,txt:'Collect 15 stars'}},
 {id:'cry',name:'Cry',c:['#fff39a','#ffc23d'],line:'#d98a12',eyes:'cry',mouth:'frown',cheeks:1,cond:{k:'world',v:1,txt:'Finish World 1'}},
 {id:'love',name:'Love',c:['#fff07a','#ffb62e'],line:'#d98a12',eyes:'heart',mouth:'smile',cheeks:1,cond:{k:'stars',v:40,txt:'Collect 40 stars'}},
 {id:'sleepy',name:'Sleepy',c:['#fff39a','#f5b840'],line:'#d98a12',eyes:'closed',mouth:'sleep',cheeks:1,cond:{k:'coins',v:300,txt:'Earn 300 coins in total'}},
 {id:'angry',name:'Angry',c:['#ff8a7a','#e8352f'],line:'#a8201c',eyes:'angry',mouth:'frown',cheeks:0,cond:{k:'wins',v:25,txt:'Complete 25 levels'}},
 {id:'cool',name:'Cool',c:['#fff07a','#ffb62e'],line:'#d98a12',eyes:'shades',mouth:'smirk',cheeks:0,fixed:1,cond:{k:'world',v:2,txt:'Finish World 2'}},
 {id:'ninja',name:'Ninja',c:['#4a5580','#1f2540'],line:'#10142a',eyes:'ninja',mouth:'none',cheeks:0,fixed:1,cond:{k:'three',v:10,txt:'Get 3 stars on 10 levels'}},
 {id:'robot',name:'Robot',c:['#d5e2f5','#8aa0c4'],line:'#5b7098',eyes:'robot',mouth:'smile',cheeks:0,fixed:1,cond:{k:'world',v:3,txt:'Finish World 3'}},
 {id:'rainbow',name:'Rainbow',c:['#fff','#fff'],line:'#8a63d2',eyes:'open',mouth:'grin',cheeks:0,cond:{k:'world',v:4,txt:'Finish World 4'}},
 {id:'golden',name:'Golden',c:['#fff1a0','#e8a700'],line:'#b97c00',eyes:'open',mouth:'grin',cheeks:1,crown:1,cond:{k:'wins',v:50,txt:'Complete all 50 levels'}}];
const CMAP={};CHARS.forEach(c=>CMAP[c.id]=c);
const PRICE={laugh:50,shock:80,cry:100,love:150,sleepy:200,angry:250,cool:300,ninja:400,robot:500,rainbow:600,golden:800};CHARS.forEach(c=>c.price=PRICE[c.id]||0);
function charProgress(ch){
  const k=ch.cond.k,v=ch.cond.v;
  switch(k){case 'default':return [1,1];case 'wins':return [doneCount(),v];case 'stars':return [totalStars(),v];
    case 'world':return [worldDone(v-1)?1:0,1];case 'coins':return [SAVE.st.earned||0,v];
    case 'three':return [Object.values(SAVE.lv).filter(e=>e.stars>=3).length,v];}
  return [0,1];
}
function drawEye(c,type,sx,r,t,blink,ex,ey){
  const x=sx*ex,y=ey,lw=r*.07;c.lineCap='round';c.lineJoin='round';c.strokeStyle='#3a2a1a';c.fillStyle='#3a2a1a';c.lineWidth=lw;

/* ---------- LEVEL VALIDATION & AUTOMATED TESTING ---------- */
function validateDef(def){
  const iss=[];
  if(!Array.isArray(def.ball)||!isFinite(def.ball[0])||!isFinite(def.ball[1]))iss.push('Ball start position is missing');
  else if(def.ball[0]<BR||def.ball[0]>W-BR||def.ball[1]>H)iss.push('Ball starts outside the playfield');
  if(!def.target||!CONT[def.target.type])iss.push('Target container is missing');
  else if(!(def.target.x>0&&def.target.x<W&&def.target.y>100&&def.target.y<=H+10))iss.push('Container is outside the playfield');
  if(!Array.isArray(def.ink)||!(def.ink[0]>0))iss.push('Ink budget must be positive');
  if(!def.pens||!def.pens.length||def.pens.some(p=>!PEN[p]))iss.push('Pen list is invalid');
  (def.objs||[]).forEach((o,i)=>{if(!LIB[o.t])iss.push('Object '+i+': unknown type "'+o.t+'"');else if(!isFinite(o.x)||!isFinite(o.y))iss.push('Object '+i+': invalid position');
    else if(('w' in o&&!(o.w>0))||('h' in o&&!(o.h>0)))iss.push('Object '+i+' ('+o.t+'): invalid size');});
  if(!iss.length){
    let sc=null;
    try{sc=new Scene(def,{headless:true});const b=sc.ball.position,st=sc.world.bodies.filter(x=>x.isStatic&&x!==sc.ball);
      if(Query.collides(Bodies.circle(b.x,b.y,BR-1),st).length)iss.push('Ball starts inside a solid object');
      const t=def.target,sup=st.filter(x=>x.label!=='cont'&&x.label!=='bounds');
      if(!Query.collides(Bodies.rectangle(t.x,t.y+4,20,6),sup).length)iss.push('Container is floating (nothing supports its base)');
    }catch(e){iss.push('Build error: '+e.message);}
    if(sc)sc.dispose();
  }
  return iss;
}
function simulate(def,useSol,maxSec){
  const sc=new Scene(def,{headless:true});let note='';
  try{
    if(useSol)for(const s of def.sol){if(sc.strokeHitsBall(s.pts,12)){note='solution overlaps ball';}sc.addStroke(s.pen,s.pts,12);}
    for(let i=0;i<60;i++)sc.step(16.67);
    sc.drop();
    for(let i=0,n=Math.floor((maxSec||30)*60);i<n&&sc.state==='running';i++)sc.step(16.67);
    return {state:sc.state,t:sc.runT,reason:sc.failReason||'',ink:sc.inkUsed(),note};
  }finally{sc.dispose();}
}
function validateAll(cb,done){
  const out=[];let i=0;
  (function next(){
    if(i>=LEVELS.length){if(done)done(out);return;}
    const d=LEVELS[i],iss=validateDef(d);let line='L'+(i+1)+' '+d.name+': ';
    if(iss.length)line+='STRUCTURE ISSUES - '+iss.join('; ');
    else{try{const r=simulate(d,true,30);line+=(r.state==='won'?'OK (solution wins in '+r.t.toFixed(1)+'s)':'SOLUTION DID NOT WIN ('+r.state+(r.reason?': '+r.reason:'')+')')+(r.note?' ['+r.note+']':'');}catch(e){line+='ERROR '+e.message;}}
    out.push(line);if(cb)cb(line,i+1,LEVELS.length);i++;setTimeout(next,15);
  })();
}

function addCoins(n){SAVE.coins+=n;SAVE.st.earned=(SAVE.st.earned||0)+n;}
function checkProgress(){
  const fresh=[];
  for(let pass=0;pass<3;pass++){let changed=false;
    ACH.forEach(a=>{if(!SAVE.ach[a.id]&&a.test()){SAVE.ach[a.id]=1;addCoins(a.reward);changed=true;toast('Achievement: '+a.name,'+'+a.reward+' coins','trophy');AU.star(2);}});
    if(!changed)break;}
  persist();return fresh;
}

const sceneEvents={
  drop(){AU.drop();SAVE.st.drops++;G.tipT=0;},
  hit(imp,pos,label){
    if(label==='spike'){const bp=G.scene.ball.position;burst(bp.x,bp.y,16,['#f2f4fa','#d9dfee','#bcc6dc'],90,0,1.1,20,-60);burst(bp.x,bp.y,6,['#ffffff'],40,0,.8,26,-40);vib(40);return;}
    if(imp<150)return;const k=clamp(imp/900,0,1);SAVE.st.bounces++;
    if(label==='rubber'||label==='tramp'||label==='bumper'||label==='springplat'){AU.boing(k);burst(pos.x,pos.y,6,['#ffd43b','#ff7eb6'],160,1,.6,6,100);spawnP(pos.x,pos.y,0,0,.4,16,'#ff9ec8',3,0);}
    else{AU.bounce(k);spawnP(pos.x,pos.y,0,0,.35,10,'#8fb4ff',3,0);}
    if(label!=='ball'){AU.hit(k);burst(pos.x,pos.y,Math.ceil(3+k*7),'#eef2fb',60+k*130,0,.55,5,150);}
    if(imp>1000)vib(25);
  },
  enter(){AU.plop();const t=G.scene.tgt;burst(t.x,t.y-50,12,['#ffd43b','#fff','#ff7eb6'],200,1,.8,6,150);},
  win(){onWin();},
  fail(r){onFail(r);}
};
function go(screen,fast){if(fast){enter(screen);return;}G.trans={to:screen,p:0,sw:false};}
function enter(screen){
  G.screen=screen;G.ov=null;G.confirm=null;
  if(screen!=='play'&&screen!=='settings'&&G.scene){G.scene.dispose();G.scene=null;G.drawing=null;AU.setRoll(0);}
  if(screen!=='play'&&screen!=='settings'&&screen!=='editor')G.testing=false;
  if(screen==='levels'){const w=Math.floor((Math.min(SAVE.unlocked,50)-1)/10);G.scroll.max=Math.max(0,5*372+20-(VH-Math.min(SAT,OY)-140));G.scroll.y=clamp(w*372,0,G.scroll.max);}
  if(screen==='editor'&&window.EDI)EDI.open();else if(window.EDI&&EDI.isOpen)EDI.close();
  resize();
}
function newScene(){
  if(G.scene){G.scene.dispose();G.scene=null;}
  G.scene=new Scene(G.def,{on:sceneEvents});G.ov=null;G.pending=null;G.drawing=null;G.hint=0;G.starSfx=0;G.msg=null;
}
function startLevel(idx,custom,daily){
  G.custom=!!custom;G.lvl=idx;G.def=custom||LEVELS[idx];G.daily=!!daily;G.restarts=0;G.pen='rigid';G.thick=1;G.thick=1;G.tipT=10;G.stars=0;G.newChars=[];G.bonusTxt='';
  newScene();go('play');
}

function onWin(){
  const sc=G.scene,d=G.def,used=sc.inkUsed();AU.win();vib([60,40,90]);
  let stars=1;if(used<=d.ink[1])stars=2;if(stars===2&&used<=d.ink[2]&&G.restarts===0)stars=3;
  G.stars=stars;G.coinsGain=0;G.newChars=[];G.bonusTxt='';
  if(G.testing)EDI.lastSol=sc.strokes.map(s=>({pen:s.pen,pts:s.pts.map(p=>[Math.round(p[0]),Math.round(p[1])])}));
  if(!G.custom&&!G.testing){
    const id=G.lvl+1,prev=SAVE.lv[id],first=!prev||!prev.stars;let coins=first?20+stars*10:5;
    SAVE.lv[id]={stars:Math.max(prev?prev.stars:0,stars)};SAVE.unlocked=Math.max(SAVE.unlocked,Math.min(50,id+1));SAVE.st.wins++;SAVE.st.minInk=Math.min(SAVE.st.minInk,used/d.ink[0]);
    const w=Math.floor((id-1)/10);if(worldDone(w)&&!SAVE.wr[w]){SAVE.wr[w]=1;coins+=100;G.bonusTxt='World complete! +100 bonus coins';toast('World Complete!',WORLDS[w].name+' +100 coins','trophy');}
    if(G.daily&&!isDailyDone()){SAVE.daily={date:todayStr(),done:true};SAVE.st.dailyDone++;coins+=50;G.bonusTxt=(G.bonusTxt?G.bonusTxt+' | ':'')+'Daily challenge +50 coins!';}
    addCoins(coins);G.coinsGain=coins;G.newChars=checkProgress();
  }
  for(let i=0;i<5;i++)setTimeout(()=>{if(G.scene===sc)burst(rnd(100,620),rnd(120,300),24,['#ff6b6b','#ffd43b','#69db7c','#4dabf7','#b197fc','#ff7eb6'],320,2,1.8,5,260);},i*220);
  G.pending={type:'win',t:1.1};
}
function onFail(r){AU.fail();vib(120);SAVE.st.fails++;persist();G.failReason=r;const b=G.scene.ball.position;if(r!=='spike')burst(clamp(b.x,20,W-20),clamp(b.y,100,H-100),10,['#8fb4ff','#fff'],160,0,.6,5,200);G.pending={type:'fail',t:.9};}
function strokeInfo(){const sc=G.scene,d=G.def,used=sc.inkUsed()+(G.drawing?G.drawing.cost:0);let s=3;if(used>d.ink[1])s=1;else if(used>d.ink[2]||G.restarts>0)s=2;return {used,frac:clamp(1-used/d.ink[0],0,1),stars:s};}

      case 'tpl':{const i=+document.getElementById('edtpl').value;this.def=JSON.parse(JSON.stringify(LEVELS[i]));this.def.name=this.def.name+' (copy)';this.sel=null;this.syncFields();this.refreshProps();this.dirty=true;edLog('Loaded template level '+(i+1)+'.');break;}
      case 'test':{const iss=validateDef(d);if(iss.length){edLog('Cannot test:\n'+iss.join('\n'));return;}G.testing=true;startLevel(0,JSON.parse(JSON.stringify(d)));break;}
      case 'save':{let all={};try{all=JSON.parse(localStorage.getItem('emojidrop.editor.v1')||'{}')||{};}catch(e){}all[d.name||'Untitled']=d;try{localStorage.setItem('emojidrop.editor.v1',JSON.stringify(all));edLog('Saved "'+d.name+'" to this browser.');}catch(e){edLog('Save failed: '+e.message);}this.slots();break;}
      case 'loadslot':{const n=document.getElementById('edslots').value;try{const all=JSON.parse(localStorage.getItem('emojidrop.editor.v1')||'{}');if(all[n]){this.def=all[n];this.sel=null;this.syncFields();this.refreshProps();this.dirty=true;edLog('Loaded "'+n+'".');}}catch(e){edLog('Load failed.');}break;}
      case 'delslot':{const n=document.getElementById('edslots').value;try{const all=JSON.parse(localStorage.getItem('emojidrop.editor.v1')||'{}');delete all[n];localStorage.setItem('emojidrop.editor.v1',JSON.stringify(all));}catch(e){}this.slots();break;}
      case 'export':{const json=JSON.stringify(d,null,1);document.getElementById('edjson').value=json;try{const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a2.download=(d.name||'level').replace(/[^a-z0-9]+/gi,'_')+'.json';document.body.appendChild(a2);a2.click();setTimeout(()=>{URL.revokeObjectURL(a2.href);a2.remove();},500);}catch(e){}edLog('Level exported as JSON.');break;}
      case 'import':{try{const o=JSON.parse(document.getElementById('edjson').value);const iss=validateDef(o);if(iss.length){edLog('Import rejected:\n'+iss.join('\n'));return;}o.ink=o.ink||[1200,800,500];o.sol=o.sol||[];o.pens=o.pens||['fixed'];o.world=o.world||0;this.def=o;this.sel=null;this.syncFields();this.refreshProps();this.dirty=true;edLog('Level imported.');}catch(e){edLog('Invalid JSON: '+e.message);}break;}
      case 'dup':this.duplicate();break;
      case 'del':this.remove();break;
      case 'setsol':if(this.lastSol&&this.lastSol.length){d.sol=this.lastSol;edLog('Hint set from last winning test ('+d.sol.length+' strokes).');}else edLog('Win the level in Test mode first.');break;
      case 'clrsol':d.sol=[];edLog('Hint cleared.');break;
      case 'val':{const iss=validateDef(d);let t=iss.length?'Issues:\n'+iss.join('\n'):'Structure OK.';if(!iss.length&&d.sol&&d.sol.length){try{const r=simulate(d,true,30);t+='\nHint simulation: '+(r.state==='won'?'WIN in '+r.t.toFixed(1)+'s':'did not win ('+r.state+')');}catch(e){t+='\nSimulation error '+e.message;}}edLog(t);break;}
      case 'valall':{edLog('Running automated level tests...');const lines=[];validateAll((l,i,n)=>{lines.push(l);edLog('Testing '+i+'/'+n+'\n'+lines.slice(-6).join('\n'));},out=>{const bad=out.filter(l=>!/ OK /.test(l));edLog('Finished. '+(out.length-bad.length)+'/'+out.length+' solutions verified.\n'+(bad.length?bad.join('\n'):'All good!'));console.log(out.join('\n'));});break;}
      case 'unlock':G.devAll=true;edLog('All levels unlocked for this session.');break;
    }
  },
  field(el){
    const d=this.def,n=()=>parseFloat(el.value);
    if(el.dataset.k!==undefined){const o=d.objs[this.sel];if(!o)return;const k=el.dataset.k;
      if(el.type==='checkbox')o[k]=el.checked;else if(el.value==='')delete o[k];else if(el.type==='number'){if(isFinite(n()))o[k]=n();}else o[k]=el.value;this.dirty=true;return;}
    if(el.classList.contains('edpen')){d.pens=Array.from(document.querySelectorAll('.edpen')).filter(c=>c.checked).map(c=>c.value);if(!d.pens.length){d.pens=['fixed'];this.syncFields();}return;}
    switch(el.id){
      case 'edname':d.name=el.value;break;case 'edtip':d.tip=el.value;break;case 'edworld':d.world=+el.value;break;
      case 'edink0':d.ink[0]=Math.max(50,n()||1000);break;case 'edink1':d.ink[1]=Math.max(20,n()||600);break;case 'edink2':d.ink[2]=Math.max(10,n()||300);break;
      case 'edbx':d.ball[0]=n()||0;this.dirty=true;break;case 'edby':d.ball[1]=n()||0;this.dirty=true;break;
      case 'edtype':d.target.type=el.value;this.dirty=true;break;case 'edtx':d.target.x=n()||0;this.dirty=true;break;case 'edty':d.target.y=n()||0;this.dirty=true;break;case 'edts':d.target.s=clamp(n()||1,.5,2);this.dirty=true;break;
    }
  },
  refreshProps(){
    const box=document.getElementById('edprops');if(!box)return;const s=this.sel;
    if(s===null||s==='ball'||s==='target'){box.innerHTML='<i>'+(s?'Ball and container are edited in the sections above (or drag them).':'Click an object on the canvas to edit it.')+'</i>';return;}
    const o=this.def.objs[s];if(!o){box.innerHTML='';return;}let h='<b>'+o.t+' #'+s+'</b><br>';
    const matSel=(val)=>'<select data-k="mat"><option value="">auto</option>'+Object.keys(MAT).map(m=>'<option'+(m===val?' selected':'')+'>'+m+'</option>').join('')+'</select>';
    Object.keys(o).forEach(k=>{if(k==='t')return;const v=o[k];
      if(typeof v==='boolean')h+='<label>'+k+'<input type="checkbox" data-k="'+k+'"'+(v?' checked':'')+'></label>';
      else if(k==='mat')h+='<label>mat '+matSel(v)+'</label>';
      else h+='<label>'+k+'<input data-k="'+k+'" type="'+(typeof v==='number'?'number':'text')+'" step="any" value="'+String(v).replace(/"/g,'')+'"></label>';});
    if(BLOCKS.has(o.t)){if(!('mat' in o))h+='<label>mat '+matSel('')+'</label>';
      [['fr','friction'],['re','bounce'],['de','density']].forEach(p=>{if(!(p[0] in o))h+='<label>'+p[1]+'<input data-k="'+p[0]+'" type="number" step="any" placeholder="auto"></label>';});
      if(!('dyn' in o))h+='<label>dynamic<input type="checkbox" data-k="dyn"></label>';}
    box.innerHTML=h;
  },
  addObj(t,x,y){
    if(!LIB[t])return;const o=Object.assign({t,x:Math.round(x/5)*5,y:Math.round(y/5)*5},JSON.parse(JSON.stringify(TYPE_DEFAULTS[t]||{})));this.def.objs.push(o);this.sel=this.def.objs.length-1;this.dirty=true;this.refreshProps();
  },
  duplicate(){const o=this.def.objs[this.sel];if(!o||typeof this.sel!=='number')return;const c=JSON.parse(JSON.stringify(o));c.x+=30;c.y+=30;this.def.objs.push(c);this.sel=this.def.objs.length-1;this.dirty=true;this.refreshProps();},
  remove(){if(typeof this.sel!=='number')return;this.def.objs.splice(this.sel,1);this.sel=null;this.dirty=true;this.refreshProps();},
  rebuild(){
    this.dirty=false;if(this.scene){this.scene.dispose();this.scene=null;}
    try{this.scene=new Scene(this.def,{headless:true});}catch(e){edLog('Scene error: '+e.message);}
  },
  isRect(o){return RECTS.has(o.t)&&o.w&&o.h;},
  hitObj(o,x,y){
    if(this.isRect(o)){const a=-(o.a||0)*Math.PI/180,dx=x-o.x,dy=y-o.y,lx=dx*Math.cos(a)-dy*Math.sin(a),ly=dx*Math.sin(a)+dy*Math.cos(a);return Math.abs(lx)<=o.w/2+5&&Math.abs(ly)<=o.h/2+5;}
    return Math.hypot(x-o.x,y-o.y)<(o.r||34*(o.s||1))+8;
  },
  hitTest(x,y){
    const d=this.def,b=d.ball;if(Math.hypot(x-b[0],y-b[1])<BR+10)return 'ball';
    const t=d.target,sp=CONT[t.type];if(sp&&Math.abs(x-t.x)<sp.ow*(t.s||1)+8&&y<t.y+8&&y>t.y-sp.h*(t.s||1)-8)return 'target';
    for(let i=d.objs.length-1;i>=0;i--)if(this.hitObj(d.objs[i],x,y))return i;return null;
  },
  down(x,y){const h=this.hitTest(x,y);this.sel=h;this.refreshProps();if(h===null){this.drag=null;return;}
    let px,py;if(h==='ball'){px=this.def.ball[0];py=this.def.ball[1];}else if(h==='target'){px=this.def.target.x;py=this.def.target.y;}else{px=this.def.objs[h].x;py=this.def.objs[h].y;}
    this.drag={ox:px-x,oy:py-y};},
  move(x,y){
    if(!this.drag||this.sel===null)return;const nx=Math.round((x+this.drag.ox)/5)*5,ny=Math.round((y+this.drag.oy)/5)*5;
    if(this.sel==='ball'){this.def.ball=[nx,ny];}else if(this.sel==='target'){this.def.target.x=nx;this.def.target.y=ny;}else{const o=this.def.objs[this.sel];o.x=nx;o.y=ny;}this.dirty=true;
  },
  up(){if(this.drag){this.drag=null;this.syncFields();this.refreshProps();}},
  key(e){
    const o=typeof this.sel==='number'?this.def.objs[this.sel]:null,st=e.shiftKey?20:5,k=e.key;let used=true;
    if(k==='Delete'||k==='Backspace')this.remove();
    else if(k==='d'||k==='D')this.duplicate();
    else if(k.startsWith('Arrow')){const dx=k==='ArrowLeft'?-st:k==='ArrowRight'?st:0,dy=k==='ArrowUp'?-st:k==='ArrowDown'?st:0;
      if(this.sel==='ball'){this.def.ball[0]+=dx;this.def.ball[1]+=dy;}else if(this.sel==='target'){this.def.target.x+=dx;this.def.target.y+=dy;}else if(o){o.x+=dx;o.y+=dy;}else used=false;}
    else if(o&&(k==='q'||k==='Q'||k==='e'||k==='E')){o.a=(o.a||0)+((k==='q'||k==='Q')?-1:1)*(e.shiftKey?15:5);}
    else if(o&&(k==='+'||k==='='||k==='-')){const sg=k==='-'?-1:1,key2=o.w!==undefined?'w':o.len!==undefined?'len':o.r!==undefined?'r':o.s!==undefined?'s':null;if(key2)o[key2]=Math.max(key2==='s'?.3:10,o[key2]+sg*(key2==='s'?.1:10));}
    else used=false;
    if(used){e.preventDefault();this.dirty=true;this.syncFields();this.refreshProps();}
  },
  draw(c){
    const d=this.def;drawBg(c,d.world||0,G.t);if(this.scene)this.scene.draw(c,G.t,{still:true});
    c.strokeStyle='rgba(60,90,160,.10)';c.lineWidth=1;c.beginPath();for(let x=0;x<=W;x+=20){c.moveTo(x,0);c.lineTo(x,H);}for(let y=0;y<=H;y+=20){c.moveTo(0,y);c.lineTo(W,y);}c.stroke();
    const s=this.sel;
    if(s!==null){c.save();c.strokeStyle='#ff3d71';c.lineWidth=3;c.setLineDash([8,6]);c.lineDashOffset=-G.t*30;
      if(s==='ball'){c.beginPath();c.arc(d.ball[0],d.ball[1],BR+8,0,TAU);c.stroke();}
      else if(s==='target'){const t=d.target,sp=CONT[t.type],sc=t.s||1;c.strokeRect(t.x-sp.ow*sc-6,t.y-sp.h*sc-6,sp.ow*sc*2+12,sp.h*sc+12);}
      else{const o=d.objs[s];if(o){if(this.isRect(o)){c.translate(o.x,o.y);c.rotate((o.a||0)*Math.PI/180);c.strokeRect(-o.w/2-5,-o.h/2-5,o.w+10,o.h+10);}else{c.beginPath();c.arc(o.x,o.y,(o.r||34*(o.s||1))+8,0,TAU);c.stroke();}}}
      c.restore();}
    d.objs.forEach((o,i)=>{if(!this.isRect(o)||i===s)return;c.save();c.fillStyle='rgba(76,110,245,.0)';c.restore();});
    T(c,'LEVEL EDITOR (developer mode)',360,24,22,'#d6336c','center',['#fff',6]);
    T(c,'Drag to move  |  Arrows nudge  |  Q/E rotate  |  +/- resize  |  D duplicate  |  Del remove',360,H-14,14,'#4a5a8c','center',['#fff',5]);
    btn(c,590,40,120,48,'Exit',()=>go('menu'),{col:'pink',fs:24,id:'edexit'});
  }};
window.EDI=EDI;
(function(){
  const stage=document.getElementById('stage');
  stage.addEventListener('dragover',e=>{if(EDI.isOpen)e.preventDefault();});
  stage.addEventListener('drop',e=>{if(!EDI.isOpen)return;e.preventDefault();const t=e.dataTransfer.getData('text/plain');if(!LIB[t])return;const r=cv.getBoundingClientRect();EDI.addObj(t,(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);});
})();

/* =====================================================================
   SECTION 18 - MAIN GAME LOOP
   ===================================================================== */
let probe=null;
function resize(){
  const ed=document.getElementById('ed'),open=ed&&ed.style.display==='block',edw=open?320:0,aw=Math.max(200,window.innerWidth-edw),ah=window.innerHeight,dpr=Math.min(window.devicePixelRatio||1,3);
  VH=open?H:clamp(Math.round(W*ah/aw),H,1728);OY=VH-H;const s=Math.min(aw/W,ah/VH);
  cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(VH*s)+'px';cv.width=Math.max(1,Math.round(W*s*dpr));cv.height=Math.max(1,Math.round(VH*s*dpr));VK=cv.width/W;
  if(!probe){probe=document.createElement('div');probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)';document.body.appendChild(probe);}
  const cs=getComputedStyle(probe);SAT=(parseFloat(cs.paddingTop)||0)/s;SAB=(parseFloat(cs.paddingBottom)||0)/s;
  document.getElementById('stage').style.right=edw+'px';
}
function update(dt){
  G.t+=dt;
  if(G.trans){G.trans.p+=dt*4.5;if(G.trans.p>=1&&!G.trans.sw){G.trans.sw=true;enter(G.trans.to);}if(G.trans.p>=2)G.trans=null;}
  G.ovT+=dt;
  if(G.screen==='play'&&G.scene){
    const sc=G.scene;
    if(!G.ov||G.ov==='win')sc.step(dt*1000);
    if(!G.ov&&sc.state==='running')AU.setRoll(sc.bs.contact>0?clamp(sc.bs.spd/700,0,1):0);else AU.setRoll(0);
    if(G.tipT>0&&sc.state==='ready'&&!G.drawing)G.tipT-=dt;
    if(G.hint>0)G.hint-=dt;if(G.msg)G.msg.t-=dt;
    if(G.pending){G.pending.t-=dt;if(G.pending.t<=0){G.ov=G.pending.type;G.ovT=0;G.starSfx=0;G.pending=null;}}
  }else AU.setRoll(0);
  if(G.screen==='editor'&&EDI.dirty)EDI.rebuild();
  updateP(dt);
  for(const t of G.toasts)t.t+=dt;if(G.toasts.length&&G.toasts[0].t>3.5)G.toasts.shift();
}
function render(){
  const c=ctx;c.setTransform(VK,0,0,VK,0,0);c.clearRect(0,0,W,VH);UI.begin();
  const ctr=Math.max(OY/2,Math.min(SAT,OY)),top=Math.min(SAT,OY);
  switch(G.screen){
    case 'menu':at(c,ctr,()=>drawMenu(c));at(c,top,()=>drawMenuTop(c));at(c,OY-Math.min(SAB,OY),()=>drawMenuBottom(c));break;case 'levels':at(c,top,()=>drawLevels(c));break;case 'chars':at(c,ctr,()=>drawChars(c));break;case 'ach':at(c,ctr,()=>drawAch(c));break;
    case 'settings':at(c,ctr,()=>drawSettings(c));break;case 'play':if(G.scene)drawPlay(c);break;case 'editor':EDI.draw(c);break;
  }
  at(c,top,()=>drawToasts(c));if(G.confirm)at(c,ctr,()=>drawConfirm(c));
  if(G.trans){const a=G.trans.p<1?G.trans.p:2-G.trans.p;c.fillStyle='rgba(226,243,255,'+clamp(a,0,1)+')';c.fillRect(0,0,W,VH);}
}
let lastTs=performance.now();
function frame(ts){
  const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
  try{update(dt);render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.screen==='play'&&G.scene&&!G.ov&&G.scene.state==='running'){G.ov='pause';G.ovT=0;}AU.setRoll(0);persist();}});
window.addEventListener('beforeunload',persist);
window.EmojiDrop={levels:LEVELS,validateAll,validateDef,simulate,save:()=>SAVE,openEditor:()=>go('editor')};
if(LEVELS.length!==50)console.warn('Expected 50 levels, found '+LEVELS.length);
resize();checkProgress();requestAnimationFrame(frame);
if(/[?&]dev\b/.test(location.search))setTimeout(()=>go('editor'),300);
})();
